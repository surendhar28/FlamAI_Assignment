<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Collaborative Drawing Canvas Engine</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header Navbar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">🎨</div>
        <h1>Collaborative Canvas Engine</h1>
        <span id="room-badge" class="room-badge">Room: default</span>
      </div>

      <div class="header-right">
        <!-- Debug Performance & Camera Stats -->
        <div class="stats-panel" id="stats-panel">
          <span class="stat-item">FPS: <strong id="stat-fps">60</strong></span>
          <span class="stat-item">Ops: <strong id="stat-ops">0</strong></span>
          <span class="stat-item">Zoom: <strong id="stat-zoom">100%</strong></span>
        </div>

        <!-- Connection Status Indicator -->
        <div id="connection-status" class="status-indicator status-disconnected">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Toolbar -->
      <aside class="toolbar-panel" id="toolbar">
        <div class="tool-section">
          <label class="section-title">Draw Tools</label>
          <div class="btn-grid">
            <button id="btn-brush" class="tool-btn active" title="Brush (B)">
              🖌️ Brush
            </button>
            <button id="btn-eraser" class="tool-btn" title="Eraser (E)">
              🧹 Eraser
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Shape Tools</label>
          <div class="btn-grid">
            <button id="btn-line" class="tool-btn" title="Straight Line (L)">
              📏 Line
            </button>
            <button id="btn-rect" class="tool-btn" title="Rectangle (R)">
              ⬛ Rect
            </button>
            <button id="btn-ellipse" class="tool-btn" title="Ellipse (O)">
              ⭕ Ellipse
            </button>
            <button id="btn-text" class="tool-btn" title="Text Annotation (T)">
              🔤 Text
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Navigation & Select</label>
          <div class="btn-grid">
            <button id="btn-select" class="tool-btn" title="Select & Drag Objects (S)">
              🎯 Select
            </button>
            <button id="btn-pan" class="tool-btn" title="Pan Canvas (Space / P)">
              🖐️ Pan
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Smart Grid & Snapping</label>
          <div class="btn-group">
            <button id="btn-grid-toggle" class="action-btn" title="Toggle Grid Mode">
              🌐 Grid
            </button>
            <button id="btn-snap-toggle" class="action-btn active" title="Toggle Snap to Grid">
              🧲 Snap
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Camera Zoom</label>
          <div class="btn-group">
            <button id="btn-zoom-out" class="action-btn" title="Zoom Out (-)">
              ➖
            </button>
            <button id="btn-zoom-reset" class="action-btn" title="Reset Zoom (100%)">
              100%
            </button>
            <button id="btn-zoom-in" class="action-btn" title="Zoom In (+)">
              ➕
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Color</label>
          <div class="color-palette">
            <button class="color-swatch active" data-color="#1E293B" style="background-color: #1E293B"></button>
            <button class="color-swatch" data-color="#EF4444" style="background-color: #EF4444"></button>
            <button class="color-swatch" data-color="#F59E0B" style="background-color: #F59E0B"></button>
            <button class="color-swatch" data-color="#10B981" style="background-color: #10B981"></button>
            <button class="color-swatch" data-color="#3B82F6" style="background-color: #3B82F6"></button>
            <button class="color-swatch" data-color="#8B5CF6" style="background-color: #8B5CF6"></button>
            <input type="color" id="picker-color" value="#1E293B" class="color-picker-input" title="Custom Color" />
          </div>
        </div>

        <div class="tool-section">
          <div class="slider-header">
            <label class="section-title">Stroke Width</label>
            <span id="width-value" class="width-value">5px</span>
          </div>
          <input type="range" id="slider-width" min="1" max="50" value="5" class="width-slider" />
        </div>

        <div class="tool-section">
          <label class="section-title">Global History</label>
          <div class="btn-group">
            <button id="btn-undo" class="action-btn" title="Global Undo (Ctrl+Z)">
              ↩️ Undo
            </button>
            <button id="btn-redo" class="action-btn" title="Global Redo (Ctrl+Y)">
              ↪️ Redo
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Export Canvas</label>
          <div class="btn-group">
            <button id="btn-export-png" class="action-btn" title="Export as High-Res PNG">
              🖼️ PNG
            </button>
            <button id="btn-export-svg" class="action-btn" title="Export as Vector SVG">
              📄 SVG
            </button>
          </div>
        </div>
      </aside>

      <!-- Canvas Area Viewport -->
      <div class="canvas-viewport" id="canvas-viewport">
        <!-- Main Drawing Canvas -->
        <canvas id="drawing-canvas"></canvas>
        <!-- Remote Cursor Overlay Canvas -->
        <div id="cursor-overlay" class="cursor-overlay"></div>

        <!-- Floating Time-Lapse Replay Control Bar -->
        <div class="replay-bar" id="replay-bar">
          <button id="btn-replay-play" class="replay-btn" title="Play Time-Lapse Replay">▶️</button>
          <button id="btn-replay-pause" class="replay-btn" title="Pause Replay">⏸️</button>
          <input type="range" id="replay-slider" min="0" max="0" value="0" class="replay-slider" />
          <span id="replay-counter" class="replay-counter">0 / 0</span>
          <button id="btn-replay-speed" class="replay-speed-btn" title="Replay Speed">1x</button>
        </div>
      </div>

      <!-- Right Sidebar Panel (Presence & Layers) -->
      <aside class="right-panel">
        <div class="panel-section">
          <div class="panel-header">
            <h3>Online Users</h3>
            <span id="user-count-badge" class="user-count-badge">0</span>
          </div>
          <ul id="user-list" class="user-list">
            <!-- Populated dynamically -->
          </ul>
        </div>

        <div class="panel-section">
          <div class="panel-header">
            <h3>Layers</h3>
            <button id="btn-add-layer" class="small-add-btn" title="Add New Layer">+</button>
          </div>
          <ul id="layer-list" class="layer-list">
            <!-- Populated dynamically -->
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
