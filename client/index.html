<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Collaborative 3D Spatial Canvas Engine</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header Navbar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">🧊</div>
        <h1>Collaborative 3D Spatial Canvas</h1>
        <span id="room-badge" class="room-badge">Room: default</span>
      </div>

      <div class="header-right">
        <!-- Debug Performance & Camera Stats -->
        <div class="stats-panel" id="stats-panel">
          <span class="stat-item">FPS: <strong id="stat-fps">60</strong></span>
          <span class="stat-item">3D Meshes: <strong id="stat-ops">0</strong></span>
          <span class="stat-item">View: <strong id="stat-zoom">Isometric</strong></span>
        </div>

        <!-- Connection Status Indicator -->
        <div id="connection-status" class="status-indicator status-disconnected">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Toolbar -->
      <aside class="toolbar-panel" id="toolbar">
        <div class="tool-section">
          <label class="section-title">3D Drawing Tools</label>
          <div class="btn-grid">
            <button id="btn-brush" class="tool-btn active" title="3D Freehand Ribbon (B)">
              🖌️ 3D Ribbon
            </button>
            <button id="btn-eraser" class="tool-btn" title="Eraser (E)">
              🧹 Eraser
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">3D Mesh Primitives</label>
          <div class="btn-grid">
            <button id="btn-box" class="tool-btn" title="3D Cube / Box (X)">
              🧊 3D Box
            </button>
            <button id="btn-sphere" class="tool-btn" title="3D Sphere (S)">
              🔮 Sphere
            </button>
            <button id="btn-cylinder" class="tool-btn" title="3D Cylinder (C)">
              🛢️ Cylinder
            </button>
            <button id="btn-line" class="tool-btn" title="3D Line (L)">
              📏 3D Line
            </button>
            <button id="btn-text" class="tool-btn" title="3D Text Annotation (T)">
              🔤 3D Text
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Navigation & Selection</label>
          <div class="btn-grid">
            <button id="btn-orbit" class="tool-btn" title="Orbit 3D Camera (Space / Drag Right)">
              🌐 Orbit
            </button>
            <button id="btn-select" class="tool-btn" title="Select 3D Objects">
              🎯 Select
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">3D Camera Views</label>
          <div class="btn-grid">
            <button id="btn-view-iso" class="action-btn active" title="Isometric 3D View">
              🎲 Iso
            </button>
            <button id="btn-view-top" class="action-btn" title="Top 2D View">
              ⬆️ Top
            </button>
            <button id="btn-view-front" class="action-btn" title="Front 3D View">
              👁️ Front
            </button>
            <button id="btn-view-side" class="action-btn" title="Side 3D View">
              ➡️ Side
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">3D Material Color</label>
          <div class="color-palette">
            <button class="color-swatch active" data-color="#3B82F6" style="background-color: #3B82F6"></button>
            <button class="color-swatch" data-color="#EF4444" style="background-color: #EF4444"></button>
            <button class="color-swatch" data-color="#F59E0B" style="background-color: #F59E0B"></button>
            <button class="color-swatch" data-color="#10B981" style="background-color: #10B981"></button>
            <button class="color-swatch" data-color="#8B5CF6" style="background-color: #8B5CF6"></button>
            <button class="color-swatch" data-color="#EC4899" style="background-color: #EC4899"></button>
            <input type="color" id="picker-color" value="#3B82F6" class="color-picker-input" title="Custom Color" />
          </div>
        </div>

        <div class="tool-section">
          <div class="slider-header">
            <label class="section-title">Mesh Size / Thickness</label>
            <span id="width-value" class="width-value">5</span>
          </div>
          <input type="range" id="slider-width" min="1" max="50" value="5" class="width-slider" />
        </div>

        <div class="tool-section">
          <label class="section-title">Global History</label>
          <div class="btn-group">
            <button id="btn-undo" class="action-btn" title="Global Undo (Ctrl+Z)">
              ↩️ Undo
            </button>
            <button id="btn-redo" class="action-btn" title="Global Redo (Ctrl+Y)">
              ↪️ Redo
            </button>
          </div>
        </div>

        <div class="tool-section">
          <label class="section-title">Export 3D Models</label>
          <div class="btn-group">
            <button id="btn-export-obj" class="action-btn" title="Export as 3D OBJ Model File">
              🧊 3D OBJ
            </button>
            <button id="btn-export-png" class="action-btn" title="Export 3D PNG Snapshot">
              🖼️ PNG
            </button>
          </div>
        </div>
      </aside>

      <!-- 3D Canvas WebGL Viewport -->
      <div class="canvas-viewport" id="canvas-viewport">
        <!-- Main WebGL 3D Canvas -->
        <canvas id="drawing-canvas"></canvas>
        <!-- Remote Cursor Overlay Canvas -->
        <div id="cursor-overlay" class="cursor-overlay"></div>

        <!-- Floating 3D Navigation Tip -->
        <div class="replay-bar" id="replay-bar">
          <span style="font-size:0.8rem; font-weight:600; color: #94A3B8;">
            💡 Tip: Drag with <strong>Right Click</strong> or select <strong>🌐 Orbit</strong> to rotate 3D camera. Scroll mouse wheel to zoom.
          </span>
        </div>
      </div>

      <!-- Right Sidebar Panel (Presence & Layers) -->
      <aside class="right-panel">
        <div class="panel-section">
          <div class="panel-header">
            <h3>Online Users</h3>
            <span id="user-count-badge" class="user-count-badge">0</span>
          </div>
          <ul id="user-list" class="user-list">
            <!-- Populated dynamically -->
          </ul>
        </div>

        <div class="panel-section">
          <div class="panel-header">
            <h3>3D Layers</h3>
            <button id="btn-add-layer" class="small-add-btn" title="Add New 3D Layer">+</button>
          </div>
          <ul id="layer-list" class="layer-list">
            <!-- Populated dynamically -->
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
